"area: backend":
  - changed-files:
      - any-glob-to-any-file: "backend/**"

"area: client":
  - changed-files:
      - any-glob-to-any-file: "client/**"

"area: paper":
  - changed-files:
      - any-glob-to-any-file: "paper/**"

"area: velocity":
  - changed-files:
      - any-glob-to-any-file: "velocity/**"

"area: web":
  - changed-files:
      - any-glob-to-any-file: "web/**"

"area: ci":
  - changed-files:
      - any-glob-to-any-file: ".github/**"

"area: build":
  - changed-files:
      - any-glob-to-any-file:
          - "gradle/**"
          - "**/*.gradle.kts"
          - "gradle.properties"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "openspec/**"
          - "**/*.md"
