name: Build PR

on: [pull_request]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    # Reuse the OneLiteFeather org build workflow (Java 25, OS matrix, tests, coverage).
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-build-pr.yml@v2.9.1
    with:
      java-version: "25"
      java-distribution: "temurin"
      run-tests: true
    secrets: inherit

  # The staff web UI (web/) is a pnpm project outside the Gradle build: lint, types, unit tests and the Nitro build.
  web:
    name: Staff web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
