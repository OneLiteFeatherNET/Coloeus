name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      docker_version:
        description: "Version to (re)build & push the backend image for, e.g. 1.2.3 (no leading v). Runs only the image job."
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  # Reusable workflow: exposes release_created, tag_name, version (and more) as job outputs. Every
  # follow-up job below gates on release_created - never on `push: tags`, because tags created with
  # GITHUB_TOKEN do not trigger workflows.
  release-please:
    if: github.event_name == 'push'
    uses: OneLiteFeatherNET/workflows/.github/workflows/release-please.yml@v2.9.1
    secrets: inherit

  # Gradle produces the Micronaut optimized Docker context and uploads it as an artifact for the
  # (toolchain-agnostic) docker job to consume.
  build-context:
    name: Build Docker context
    needs: release-please
    # Runs on a real release, or on a manual dispatch to (re)publish a given version.
    if: |
      always() &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
       github.event_name == 'workflow_dispatch')
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-docker-context.yml@v2.9.1
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.docker_version || needs.release-please.outputs.version }}
      gradle-command: "./gradlew :backend:jar :backend:optimizedBuildLayers :backend:optimizedDockerfile -Pversion=$VERSION"
      context-path: "backend/build/docker/optimized"
      artifact-name: "docker-context-release"
    secrets: inherit

  docker:
    name: Build Docker image
    needs: [release-please, build-context]
    permissions:
      contents: read
      id-token: write   # keyless cosign signing via GitHub OIDC
    if: |
      always() && needs.build-context.result == 'success' &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
       github.event_name == 'workflow_dispatch')
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.9.1
    with:
      image-name: "onelitefeather/coloeus"
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.docker_version || needs.release-please.outputs.version }}
      context: "backend/build/docker/optimized"
      artifact-name: "docker-context-release"
      blob-chunk: "90000000"   # ~90 MB, under the 100 MB Cloudflare cap
      req-concurrent: "4"
    secrets: inherit

  # The staff web UI is its own service: a Nuxt 4 application served by its Nitro server (Node 24). Its image is built
  # from web/ of the checked-out ref with its own Dockerfile (pnpm install from the lockfile, then the build), and is
  # pushed with the same tags and signature as the backend image. No backend build step is involved.
  docker-admin:
    name: Build admin image
    needs: release-please
    permissions:
      contents: read
      id-token: write   # keyless cosign signing via GitHub OIDC
    if: |
      always() &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
       github.event_name == 'workflow_dispatch')
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.9.1
    with:
      image-name: "onelitefeather/coloeus-admin"
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.docker_version || needs.release-please.outputs.version }}
      context: "web"
      blob-chunk: "90000000"   # ~90 MB, under the 100 MB Cloudflare cap
      req-concurrent: "4"
    secrets: inherit

  # The Paper plugin jar is shaded. Servers download it from the GitHub release next to the Vault plugin, so it is
  # attached to the release rather than published as an image.
  paper-jar:
    name: Attach Paper plugin jar
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Build the Paper plugin jar
        env:
          ONELITEFEATHER_MAVEN_USERNAME: ${{ secrets.ONELITEFEATHER_MAVEN_USERNAME }}
          ONELITEFEATHER_MAVEN_PASSWORD: ${{ secrets.ONELITEFEATHER_MAVEN_PASSWORD }}
        run: ./gradlew :paper:shadowJar -Pversion="${RELEASE_VERSION}"
      - name: Attach the jar to the GitHub release
        run: gh release upload "${RELEASE_TAG}" paper/build/libs/coloeus-paper-*.jar --clobber

  # The Java dependency inventory is built by CycloneDX from the Gradle runtime classpath. Trivy cannot read Gradle
  # dependencies without a gradle.lockfile, so the reusable SBOM job below publishes this file instead of a scan.
  sbom-gradle-bom:
    name: Build SBOM
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Build the aggregate CycloneDX SBOM
        env:
          ONELITEFEATHER_MAVEN_USERNAME: ${{ secrets.ONELITEFEATHER_MAVEN_USERNAME }}
          ONELITEFEATHER_MAVEN_PASSWORD: ${{ secrets.ONELITEFEATHER_MAVEN_PASSWORD }}
        run: ./gradlew cyclonedxBom -Pversion="${RELEASE_VERSION}"
      - name: Upload the SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-gradle
          path: build/reports/cyclonedx/bom.json
          if-no-files-found: error

  # Dependency inventory of the release, shipped to Dependency-Track. The Java SBOM comes from the sbom-gradle-bom
  # artifact; the reusable workflow only uploads it.
  sbom:
    name: Publish SBOM
    needs: [release-please, sbom-gradle-bom]
    if: needs.release-please.outputs.release_created == 'true'
    uses: OneLiteFeatherNET/workflows/.github/workflows/sbom-publish.yml@v2.9.1
    with:
      project-name: "Coloeus"
      project-version: ${{ needs.release-please.outputs.version }}
      artifact-name: "sbom-gradle"
      sbom-path: "bom.json"
      parent-uuid: "ea5a635f-b018-4bec-bee7-137608e67ff2"
      is-latest: true
    secrets: inherit

  # The web UI has its own image, so its dependencies are published as a separate project. Without an artifact the
  # reusable workflow scans the checked-out tag with Trivy, which reads web/pnpm-lock.yaml from scan-ref.
  sbom-admin:
    name: Publish SBOM (admin web)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: OneLiteFeatherNET/workflows/.github/workflows/sbom-publish.yml@v2.9.1
    with:
      project-name: "Coloeus Admin"
      project-version: ${{ needs.release-please.outputs.version }}
      scan-ref: web
      parent-uuid: "ea5a635f-b018-4bec-bee7-137608e67ff2"
      is-latest: true
    secrets: inherit
